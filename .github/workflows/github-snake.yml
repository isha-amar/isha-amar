name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: isha-amar
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff5aac&color_dots=%23f7d6eb,%23f4b4d8,%23ea77bb,%23c35b9d,%23913d73
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff75c5&color_dots=%23251932,%23513668,%238b4381,%23c35a9d,%23ff9bd4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
